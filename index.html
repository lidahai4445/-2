<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2022-2026 考研数二 · 英二 全真题三刷系统</title>
  <link rel="stylesheet" href="styles.css?v=20261105_v8" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="top-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="brand-area">
          <div class="brand-logo">研</div>
          <div class="brand-title">
            <h1>2022–2026 考研数二 · 英二 全真题三刷</h1>
          </div>
        </div>
        <!-- 科目切换胶囊 -->
        <div class="subject-pills" id="subject-pills-container"></div>
      </div>

      <!-- 核心功能视图切换 -->
      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="practice" onclick="switchTab('practice')">
          🎯 真题刷卷 (350题)
        </button>
        <button class="nav-tab" data-tab="wrong-book" onclick="switchTab('wrong-book')">
          📕 错题本
          <span class="badge-pill badge-danger" id="wrong-count-badge">0</span>
        </button>
        <button class="nav-tab" data-tab="ai-hub" onclick="switchTab('ai-hub')">
          🤖 高频速记 & AI导入
        </button>
      </nav>

      <!-- 三刷全局统计 + 多端实时云同步按钮 -->
      <div class="global-stats">
        <div class="stat-chip pass1">一刷 <strong id="stat-pass1">0/0</strong></div>
        <div class="stat-chip pass2">二刷 <strong id="stat-pass2">0/0</strong></div>
        <div class="stat-chip pass3">三刷★ <strong id="stat-pass3">0/0</strong></div>
        <button class="cloud-sync-pill" id="cloud-sync-btn" onclick="openCloudSyncModal()" title="多设备实时云端同步设置">
          <span class="sync-dot" id="sync-status-dot"></span>
          <span id="sync-status-text">☁️ 云同步</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 双栏主体：左侧套卷与专题筛选 + 右侧真题原生刷题区 -->
  <main class="app-container">
    <aside class="left-sidebar" id="left-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">📅 真题年份套卷</div>
        <div class="year-list" id="year-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">📑 考点 / 题型模块</div>
        <div class="chapter-list" id="chapter-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">🔁 三刷进度筛选</div>
        <div class="filter-chips">
          <button class="filter-chip active" data-pass-filter="all" onclick="setPassFilter('all')">全部</button>
          <button class="filter-chip" data-pass-filter="unfinished" onclick="setPassFilter('unfinished')">未满三刷</button>
          <button class="filter-chip" data-pass-filter="pass0" onclick="setPassFilter('pass0')">0刷</button>
          <button class="filter-chip" data-pass-filter="pass1" onclick="setPassFilter('pass1')">1刷</button>
          <button class="filter-chip" data-pass-filter="pass2" onclick="setPassFilter('pass2')">2刷</button>
          <button class="filter-chip" data-pass-filter="pass3" onclick="setPassFilter('pass3')">3刷★</button>
        </div>
      </div>
    </aside>

    <!-- 主刷题区 -->
    <section class="main-stage">
      <!-- 顶部题号答题卡面板 -->
      <div class="question-strip-card" id="question-strip-card">
        <div class="strip-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="strip-header-left" id="filtered-count-label">题库加载中...</span>
            <button class="btn btn-outline btn-xs" id="toggle-dots-btn" onclick="toggleDotsCollapse()">收起题号卡 ▲</button>
          </div>
          <div class="strip-legend">
            <span><i class="legend-dot" style="background:#cbd5e1;"></i>0刷</span>
            <span><i class="legend-dot" style="background:var(--pass1-color);"></i>1刷</span>
            <span><i class="legend-dot" style="background:var(--pass2-color);"></i>2刷</span>
            <span><i class="legend-dot" style="background:var(--pass3-color);"></i>3刷★</span>
            <span><i class="legend-dot" style="background:var(--danger);"></i>错题</span>
          </div>
        </div>
        <div class="question-dots-grid" id="question-dots-grid"></div>
      </div>

      <!-- 动态真题内容区 -->
      <div id="main-view-content"></div>
    </section>
  </main>

  <!-- 多设备实时云同步管理弹窗 -->
  <div class="modal-backdrop" id="cloud-sync-modal" onclick="if(event.target===this) closeCloudSyncModal()">
    <div class="modal-window" style="max-width:540px;">
      <div class="modal-header">
        <h3 style="font-size:16px;">☁️ 多设备实时云同步中心</h3>
        <button class="btn btn-outline btn-sm" onclick="closeCloudSyncModal()">✖ 关闭</button>
      </div>
      <div class="modal-body" style="text-align:left;background:#ffffff;padding:20px;">
        <p style="font-size:13.5px;color:var(--text-secondary);margin-bottom:14px;">
          只要在电脑、手机或平板上使用相同的<strong>同步口令</strong>（已默认设为您的专属口令 <code>lidahai4445</code>），每做完一道题都会实时自动同步到云端，换设备打开网页自动恢复进度！
        </p>

        <div style="background:var(--bg-page);border:1px solid var(--border-light);border-radius:8px;padding:14px;margin-bottom:16px;">
          <label style="font-size:12.5px;font-weight:700;color:var(--text-secondary);display:block;margin-bottom:6px;">
            🔑 您的跨设备同步口令 (Sync ID)：
          </label>
          <div style="display:flex;gap:8px;">
            <input
              type="text"
              id="sync-id-input"
              class="step-num-input"
              style="flex:1;width:auto;"
              placeholder="例如：lidahai4445"
            />
            <button class="btn btn-primary btn-sm" onclick="saveAndSwitchSyncId()">保存口令并同步</button>
          </div>
          <div id="cloud-modal-status" style="font-size:12.5px;color:var(--primary);margin-top:8px;font-weight:600;"></div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
          <button class="btn btn-primary btn-sm" style="flex:1;justify-content:center;" onclick="manualPushToCloud()">
            ⬆️ 立即推送本机进度到云端
          </button>
          <button class="btn btn-outline btn-sm" style="flex:1;justify-content:center;" onclick="manualPullFromCloud()">
            ⬇️ 立即从云端拉取并合并进度
          </button>
        </div>

        <div style="border-top:1px dashed var(--border-light);padding-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <span style="font-size:12.5px;color:var(--text-muted);">离线文件备份（可选）：</span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-xs" onclick="exportProgressJsonFile()">💾 导出进度文件 (.json)</button>
            <label class="btn btn-outline btn-xs" style="cursor:pointer;margin:0;">
              📂 导入进度文件
              <input type="file" accept=".json" style="display:none;" onchange="importProgressJsonFile(event)" />
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="questions.js?v=20261105_v8"></script>
  <script src="kaoyan_questions.js?v=20261105_v8"></script>
  <script src="app.js?v=20261105_v8"></script>
</body>
</html>
