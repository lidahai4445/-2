<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>背单词</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #111827;
      --sec: #4b5563;
      --muted: #9ca3af;
      --line: #eef0f4;
      --border: #e5e7eb;
      --primary: #2563eb;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }
    button, select { font-family: inherit; }

    /* 极简顶栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      gap: 10px;
    }
    .back-link {
      text-decoration: none;
      color: var(--sec);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background .15s;
    }
    .back-link:hover { background: #eef1f6; }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ghost-select, .ghost-btn {
      font-size: 13px;
      color: var(--sec);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
    }
    .ghost-select:hover, .ghost-btn:hover { border-color: #cbd5e1; color: var(--text); }

    /* 主舞台与纯净卡片 */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 28px;
    }
    .card {
      width: 100%;
      max-width: 620px;
      min-height: 460px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(17, 24, 39, 0.04);
      border: 1px solid var(--line);
      padding: 26px 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 卡片顶栏：左侧三格掌握度 + 右侧生词/熟词 */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    .steps {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .step-bar {
      width: 16px;
      height: 4px;
      border-radius: 2px;
      background: #e5e7eb;
      transition: background .2s;
    }
    .step-bar.on { background: var(--green); }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-tag {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: all .15s;
    }
    .action-tag:hover { background: #f3f4f6; color: var(--sec); }
    .action-tag.star-on {
      color: #d97706;
      background: #fffbeb;
      border-color: #fde68a;
      font-weight: 600;
    }
    .action-tag.fam-on {
      color: var(--green);
      background: #ecfdf5;
      border-color: #a7f3d0;
      font-weight: 600;
    }

    /* 居中单词展示区（第一阶段） */
    .question-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 0;
    }
    .word-main {
      font-size: 48px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
      line-height: 1.15;
    }
    .phonetic {
      margin-top: 10px;
      font-size: 15px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 99px;
      transition: color .15s, background .15s;
    }
    .phonetic:hover { color: var(--primary); background: #eff6ff; }
    .context-sent {
      margin-top: 28px;
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--sec);
      max-width: 480px;
    }
    .context-sent .hl {
      color: var(--text);
      font-weight: 600;
      border-bottom: 1.5px solid var(--primary);
      padding-bottom: 1px;
    }

    /* 第一阶段底部：极简三键 */
    .judge-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .j-btn {
      padding: 14px 10px;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      transition: all .15s;
    }
    .j-btn:active { transform: scale(0.98); }
    .j-btn.unknown { color: var(--red); border-color: #fee2e2; background: #fef2f2; }
    .j-btn.unknown:hover { background: #fee2e2; }
    .j-btn.vague { color: #d97706; border-color: #fef3c7; background: #fffbeb; }
    .j-btn.vague:hover { background: #fef3c7; }
    .j-btn.known { color: #059669; border-color: #d1fae5; background: #ecfdf5; }
    .j-btn.known:hover { background: #d1fae5; }

    /* 第二阶段：干净释义详情视图 */
    .detail-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px 0 16px;
    }
    .detail-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .detail-word {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
    }
    .meanings {
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meaning-row {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      display: flex;
      gap: 8px;
    }
    .pos {
      color: var(--muted);
      font-weight: 600;
      min-width: 32px;
      font-size: 14px;
    }
    .sent-block {
      margin-top: 4px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--sec);
      cursor: pointer;
    }
    .sent-block .cn {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    /* 派生 / 近义 / 短语 / 巧记 轻量标签栏 */
    .ext-tabs {
      display: flex;
      gap: 18px;
      margin-top: 16px;
      border-bottom: 1px solid var(--line);
    }
    .ext-tab {
      background: none;
      border: none;
      padding: 6px 0 8px;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .ext-tab.active {
      color: var(--text);
      font-weight: 600;
      border-bottom-color: var(--text);
    }
    .ext-panel {
      padding: 12px 0 4px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--sec);
      min-height: 88px;
      max-height: 190px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #e5e7eb transparent;
    }
    .ext-panel::-webkit-scrollbar { width: 4px; }
    .ext-panel::-webkit-scrollbar-track { background: transparent; }
    .ext-panel::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
    .ext-row {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      align-items: baseline;
    }
    .ext-w {
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    .ext-w:hover { color: var(--primary); }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .w-chip {
      padding: 2px 9px;
      background: var(--bg);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .w-chip:hover { color: var(--primary); background: #eff6ff; }

    /* 第二阶段底栏：记错了 + 下一词 */
    .next-bar {
      display: flex;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .btn-fix {
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--sec);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-fix:hover { color: var(--red); border-color: #fecaca; background: #fef2f2; }
    .btn-next {
      flex: 1;
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: var(--text);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-next:hover { opacity: 0.9; }

    /* 小组完成列表 & 弹窗 */
    .sum-list {
      margin: 14px 0;
      max-height: 320px;
      overflow-y: auto;
      border-top: 1px solid var(--line);
    }
    .sum-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .sum-w { font-weight: 600; min-width: 100px; cursor: pointer; }
    .sum-m { flex: 1; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      padding: 20px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 15px;
      padding-bottom: 10px;
    }

    @media (max-width: 560px) {
      .card { padding: 20px 18px 22px; min-height: 420px; }
      .word-main { font-size: 38px; }
      .topbar { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html">← 返回</a>
    <div class="top-controls">
      <select class="ghost-select" id="filter-select" title="词库范围">
        <option value="todo">待背</option>
        <option value="star">⭐ 生词本</option>
        <option value="unknown">错词本</option>
        <option value="learned">已掌握</option>
        <option value="familiar">熟词本</option>
      </select>
      <select class="ghost-select" id="order-select" title="顺序">
        <option value="list">正序</option>
        <option value="shuffle">乱序</option>
        <option value="alpha">A-Z</option>
      </select>
      <button class="ghost-btn" id="btn-group-list">本组 10 词</button>
    </div>
  </header>

  <main class="stage">
    <div class="card" id="card"></div>
  </main>

  <div class="modal-backdrop" id="group-modal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modal-title">本组 10 词</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <label style="font-size:12.5px;color:var(--sec);font-weight:400;cursor:pointer;">
            <input type="checkbox" id="auto-speak" style="vertical-align:middle;" /> 自动发音
          </label>
          <button class="ghost-btn" id="btn-rebuild-group">换一组</button>
          <button class="ghost-btn" id="btn-close-modal">关闭</button>
        </div>
      </div>
      <div class="sum-list" id="modal-body"></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-top:6px;">
        <span id="sync-status">本机模式</span>
        <span>快捷键：1 不认识 · 2 模糊 · 3/空格 认识</span>
      </div>
    </div>
  </div>

  <script src="words_data.js?v=20261108_w3"></script>
  <script src="words.js?v=20261108_w3"></script>
</body>
</html>
